<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | VANTIX DIGITAL</title><meta name="description" content="Get in touch with VANTIX DIGITAL to discuss your website, marketing, CRM or e-commerce project."><meta property="og:title" content="Contact | VANTIX DIGITAL"><meta property="og:description" content="Get in touch with VANTIX DIGITAL to discuss your website, marketing, CRM or e-commerce project."><meta name="theme-color" content="#07172F">
<link rel="icon" href="/assets/logo/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css"></head><body class="sub"><header id="site-header"></header><main>
<section class="pagehead"><div class="wrap"><span class="eyebrow">Contact</span><h1>Let's discuss your project</h1><p>Tell us what you are working towards. We will review your enquiry and come back to you.</p></div></section>
<section><div class="wrap" style="max-width:760px">
<form id="contact-form" novalidate><div class="fields">
<div><label for="name">Full name *</label><input id="name" name="name" autocomplete="name" required><span class="err" id="e-name"></span></div>
<div><label for="email">Email address *</label><input id="email" name="email" type="email" autocomplete="email" required><span class="err" id="e-email"></span></div>
<div><label for="company">Company or business name</label><input id="company" name="company" autocomplete="organization"></div>
<div><label for="service">Service required *</label><select id="service" name="service"><option value="">Select a service</option></select><span class="err" id="e-service"></span></div>
<div class="full"><label for="message">Project details *</label><textarea id="message" name="message" rows="6"></textarea><span class="err" id="e-message"></span></div></div>
<input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<div id="form-msg" role="alert"></div><button class="btn" type="submit">Send Enquiry</button></form>
<div class="ok" id="form-ok" hidden role="status"><h2>Thank you</h2><p>Your enquiry has been sent. We will be in touch soon.</p></div>
</div></section>
</main><footer id="site-footer"></footer><script src="/js/data.js"></script><script src="/js/main.js"></script></body></html>
